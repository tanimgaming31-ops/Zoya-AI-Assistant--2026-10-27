name: Zoya Build and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: zoya-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Package complete source ZIP
        run: |
          zip -q -r Zoya-AI-Assistant-source.zip src public scripts tests .github package.json package-lock.json tsconfig.json vite.config.ts index.html postcss.config.cjs tailwind.config.cjs README.md ANDROID-SETUP-BN.md .gitignore
      - name: Save downloadable Zoya source
        uses: actions/upload-artifact@v4
        with:
          name: zoya-complete-source
          path: Zoya-AI-Assistant-source.zip
          if-no-files-found: error
      - name: Save downloadable Zoya website
        uses: actions/upload-artifact@v4
        with:
          name: zoya-built-website
          path: dist
          if-no-files-found: error
      - name: Check GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Explain how to activate GitHub Pages
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::The app built and the website ZIP is downloadable, but GitHub Pages is not yet activated."
          echo "::warning::Repo Settings > Pages > Build and deployment > Source: GitHub Actions. Then rerun this workflow."
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: dist
      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
