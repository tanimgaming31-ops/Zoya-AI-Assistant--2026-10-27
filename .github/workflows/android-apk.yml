name: Build Zoya Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Zoya sources
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle build cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install Zoya dependencies
        run: npm install --no-audit --no-fund
      - name: Run JavaScript checks
        run: npm test
      - name: Build offline-bundled Zoya web UI
        run: npm run build
      - name: Create native Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Add microphone permission and Zoya launcher icons
        run: node scripts/configure-android.mjs
      - name: Compile and debug-sign Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Check APK was created
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Downloadable phone-installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Zoya-AI-Assistant-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
